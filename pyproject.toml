[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outgunned-pdf"
version = "0.1.0"
description = "Layout-aware PDF-to-Markdown converters for the Outgunned library"
requires-python = ">=3.10"

[project.scripts]
outgunned-pdf = "outgunned_pdf.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
