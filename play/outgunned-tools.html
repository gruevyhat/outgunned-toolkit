ne","Lawson","Lee","Lewis","Mason","Miller","Morgan","Morris","Nash","Nguyen","Nolan","Ortiz","Parker","Patel","Perry","Price","Reed","Reyes","Rivera","Ross","Santos","Shah","Shaw","Silva","Singh","Smith","Stone","Taylor","Thomas","Turner","Vega","Walker","Wallace","Warren","Washington","Watson","Wells","West","Williams","Wilson","Wong","Young"],s_=["Aiden","Clay","Kelly","Owen","River","Terry","Ali","Dylan","Kim","Pat","Rowan","Toni","Ash","Finn","Lee","Piper","Sam","Tyler","Billy","Francis","Mason","Quinn","Sean","Val","Bobby","Jack","Miller","Ray","Shay","Vic","Charlie","Jude","Nicky","Riley","Taylor","Wynn"],l_={die:"d6x2",pageRef:57,source:"Assistant Director ENG 1.0",columns:["name"],rows:[{roll:"11",name:"Aiden"},{roll:"12",name:"Clay"},{roll:"13",name:"Kelly"},{roll:"14",name:"Owen"},{roll:"15",name:"River"},{roll:"16",name:"Terry"},{roll:"21",name:"Ali"},{roll:"22",name:"Dylan"},{roll:"23",name:"Kim"},{roll:"24",name:"Pat"},{roll:"25",name:"Rowan"},{roll:"26",name:"Toni"},{roll:"31",name:"Ash"},{roll:"32",name:"Finn"},{roll:"33",name:"Lee"},{roll:"34",name:"Piper"},{roll:"35",name:"Sam"},{roll:"36",name:"Tyler"},{roll:"41",name:"Billy"},{roll:"42",name:"Francis"},{roll:"43",name:"Mason"},{roll:"44",name:"Quinn"},{roll:"45",name:"Sean"},{roll:"46",name:"Val"},{roll:"51",name:"Bobby"},{roll:"52",name:"Jack"},{roll:"53",name:"Miller"},{roll:"54",name:"Ray"},{roll:"55",name:"Shay"},{roll:"56",name:"Vic"},{roll:"61",name:"Charlie"},{roll:"62",name:"Jude"},{roll:"63",name:"Nicky"},{roll:"64",name:"Riley"},{roll:"65",name:"Taylor"},{roll:"66",name:"Wynn"}]},u_={_meta:i_,firstNames:a_,surnames:o_,unisex:s_,unisexTable:l_},c_={source:"Original toolkit content",transcribed:"2026-09-05"},d_=JSON.parse('[{"id":"q01","prompt":"The getaway car stalls with sirens closing in. You…","answers":[{"text":"Pop the hood. Thirty seconds.","weights":{"skill:fix":2,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Draw down and buy everyone time.","weights":{"skill:shoot":2,"skill:cool":1,"attr:nerves":1,"trope:diehard":1}},{"text":"Bail and run the alleys.","weights":{"skill:stunt":2,"skill:stealth":1,"attr:crime":1,"trope:bad_to_the_bone":1}},{"text":"Talk the first cop into a lift.","weights":{"skill:speech":2,"attr:smooth":1,"trope:cheater":1}}]},{"id":"q02","prompt":"A locked service door is the only way into the building. You…","answers":[{"text":"Shoulder it off its hinges.","weights":{"skill:force":2,"attr:brawn":1,"trope:hunk":1}},{"text":"Study the lock and work it quietly.","weights":{"skill:dexterity":2,"skill:fix":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Find a staff entrance and blend in.","weights":{"skill:stealth":2,"skill:style":1,"attr:crime":1,"trope:cheater":1}},{"text":"Make a confident request of the guard.","weights":{"skill:speech":2,"skill:leadership":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q03","prompt":"Your contact has sold you out. The room goes silent. You…","answers":[{"text":"Keep your cool and watch every exit.","weights":{"skill:cool":2,"skill:awareness":1,"attr:nerves":1,"trope:lone_wolf":1}},{"text":"Put them on the spot with a hard question.","weights":{"skill:detect":2,"skill:streetwise":1,"attr:focus":1,"trope:party_killer":1}},{"text":"Smile, flirt, and turn the betrayal around.","weights":{"skill:flirt":2,"skill:speech":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Hit first and ask questions later.","weights":{"skill:fight":2,"skill:force":1,"attr:brawn":1,"trope:jerk_with_a_heart_of_gold":1}}]},{"id":"q04","prompt":"The team is lost in unfamiliar country before sunrise. You…","answers":[{"text":"Read the terrain and make a route.","weights":{"skill:survival":2,"skill:awareness":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Ask locals the right questions.","weights":{"skill:streetwise":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}},{"text":"Repair the radio and call for coordinates.","weights":{"skill:fix":2,"skill:know":1,"attr:focus":1,"trope:genius_bruiser":1}},{"text":"Lead everyone onward, no matter the weather.","weights":{"skill:leadership":2,"skill:endure":1,"attr:nerves":1,"trope:leader":1}}]},{"id":"q05","prompt":"A rival draws a weapon in a crowded station. You…","answers":[{"text":"Spot the threat before anyone else does.","weights":{"skill:awareness":2,"skill:detect":1,"attr:crime":1,"trope:party_killer":1}},{"text":"Take the hit and keep moving.","weights":{"skill:endure":2,"skill:fight":1,"attr:brawn":1,"trope:last_boy_scout":1}},{"text":"Slip behind the nearest pillar.","weights":{"skill:stealth":2,"skill:stunt":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Get the crowd safely out of the way.","weights":{"skill:heal":2,"skill:leadership":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q06","prompt":"The safe contains a timer, a map, and three unlabeled keys. You…","answers":[{"text":"Test the mechanism until it makes sense.","weights":{"skill:fix":2,"skill:know":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Pocket the keys and improvise.","weights":{"skill:dexterity":2,"skill:streetwise":1,"attr:crime":1,"trope:cheater":1}},{"text":"Call the shot and pick a key.","weights":{"skill:cool":2,"skill:detect":1,"attr:nerves":1,"trope:party_killer":1}},{"text":"Force the safe open before the timer wins.","weights":{"skill:force":2,"skill:stunt":1,"attr:brawn":1,"trope:hunk":1}}]},{"id":"q07","prompt":"A helicopter offers one seat out of the collapsing compound. You…","answers":[{"text":"Take the controls and fly.","weights":{"skill:drive":2,"skill:awareness":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Put the most injured person aboard.","weights":{"skill:heal":2,"skill:leadership":1,"attr:smooth":1,"trope:good_samaritan":1}},{"text":"Find another route through the wreckage.","weights":{"skill:stunt":2,"skill:survival":1,"attr:brawn":1,"trope:vigilante":1}},{"text":"Stay behind to cover the retreat.","weights":{"skill:shoot":2,"skill:endure":1,"attr:crime":1,"trope:diehard":1}}]},{"id":"q08","prompt":"Your mark invites you to a gala. You prepare by…","answers":[{"text":"Learning every name and piece of gossip.","weights":{"skill:know":2,"skill:detect":1,"attr:focus":1,"trope:mentor":1}},{"text":"Choosing an outfit nobody can forget.","weights":{"skill:style":2,"skill:flirt":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Planning three exits and a fallback.","weights":{"skill:awareness":2,"skill:fix":1,"attr:crime":1,"trope:leader":1}},{"text":"Bringing the perfect concealed weapon.","weights":{"skill:shoot":2,"skill:dexterity":1,"attr:nerves":1,"trope:bad_to_the_bone":1}}]},{"id":"q09","prompt":"A teammate freezes during the firefight. You…","answers":[{"text":"Shout an order they can follow.","weights":{"skill:leadership":2,"skill:speech":1,"attr:smooth":1,"trope:leader":1}},{"text":"Drag them behind cover.","weights":{"skill:force":2,"skill:endure":1,"attr:brawn":1,"trope:trusty_sidekick":1}},{"text":"Create a diversion and draw the fire away.","weights":{"skill:stunt":2,"skill:cool":1,"attr:nerves":1,"trope:trusty_sidekick":1}},{"text":"Treat the wound when the shooting stops.","weights":{"skill:heal":2,"skill:fix":1,"attr:focus":1,"trope:good_samaritan":1}}]},{"id":"q10","prompt":"You need information from a hostile witness. You…","answers":[{"text":"Offer a deal they cannot refuse.","weights":{"skill:speech":2,"skill:flirt":1,"attr:smooth":1,"trope:cheater":1}},{"text":"Notice the lie behind their story.","weights":{"skill:detect":2,"skill:know":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Find the pressure point and lean on it.","weights":{"skill:streetwise":2,"skill:awareness":1,"attr:crime":1,"trope:jerk_with_a_heart_of_gold":1}},{"text":"Wait them out without blinking.","weights":{"skill:cool":2,"skill:endure":1,"attr:nerves":1,"trope:lone_wolf":1}}]},{"id":"q11","prompt":"The bridge ahead has washed out. You…","answers":[{"text":"Build a crossing from whatever is nearby.","weights":{"skill:fix":2,"skill:force":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Jump it at a run.","weights":{"skill:stunt":2,"skill:survival":1,"attr:brawn":1,"trope:free_spirit":1}},{"text":"Find the quietest path around.","weights":{"skill:awareness":2,"skill:stealth":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Get the others across first.","weights":{"skill:leadership":2,"skill:heal":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q12","prompt":"A guard recognizes your face at the checkpoint. You…","answers":[{"text":"Give them a new name and a straight story.","weights":{"skill:speech":2,"skill:style":1,"attr:smooth":1,"trope:cheater":1}},{"text":"Slip away while their radio crackles.","weights":{"skill:stealth":2,"skill:dexterity":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Drive straight through the barrier.","weights":{"skill:drive":2,"skill:force":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Tell them exactly why they should let you pass.","weights":{"skill:leadership":2,"skill:cool":1,"attr:focus":1,"trope:good_samaritan":1}}]},{"id":"q13","prompt":"The villain leaves a coded message. You…","answers":[{"text":"Spot the pattern in the numbers.","weights":{"skill:know":2,"skill:detect":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Search the room for the missing piece.","weights":{"skill:awareness":2,"skill:stealth":1,"attr:crime":1,"trope:cool_but_distressed":1}},{"text":"Ask who benefits from the threat.","weights":{"skill:streetwise":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}},{"text":"Destroy it and make your own message.","weights":{"skill:style":2,"skill:stunt":1,"attr:nerves":1,"trope:vigilante":1}}]},{"id":"q14","prompt":"Your ride is surrounded in a parking garage. You…","answers":[{"text":"Punch the accelerator and take the ramp.","weights":{"skill:drive":2,"skill:stunt":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Fight your way to the nearest exit.","weights":{"skill:fight":2,"skill:force":1,"attr:brawn":1,"trope:genius_bruiser":1}},{"text":"Talk one attacker into opening a lane.","weights":{"skill:speech":2,"skill:flirt":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Disappear between the concrete pillars.","weights":{"skill:stealth":2,"skill:awareness":1,"attr:crime":1,"trope:lone_wolf":1}}]},{"id":"q15","prompt":"The mission plan is falling apart. You…","answers":[{"text":"Rewrite it on the spot.","weights":{"skill:know":2,"skill:fix":1,"attr:focus":1,"trope:leader":1}},{"text":"Keep everyone moving forward.","weights":{"skill:leadership":2,"skill:cool":1,"attr:nerves":1,"trope:leader":1}},{"text":"Follow your instincts and improvise.","weights":{"skill:survival":2,"skill:stunt":1,"attr:brawn":1,"trope:free_spirit":1}},{"text":"Make the hard call nobody else will.","weights":{"skill:detect":2,"skill:shoot":1,"attr:crime":1,"trope:party_killer":1}}]},{"id":"q16","prompt":"A wounded stranger asks for help during your escape. You…","answers":[{"text":"Stop and patch them up.","weights":{"skill:heal":2,"skill:endure":1,"attr:focus":1,"trope:good_samaritan":1}},{"text":"Carry them until the danger passes.","weights":{"skill:force":2,"skill:survival":1,"attr:brawn":1,"trope:last_boy_scout":1}},{"text":"Promise to return with help.","weights":{"skill:speech":2,"skill:leadership":1,"attr:smooth":1,"trope:trusty_sidekick":1}},{"text":"Check whether this is a trap first.","weights":{"skill:awareness":2,"skill:detect":1,"attr:crime":1,"trope:party_killer":1}}]},{"id":"q17","prompt":"A chase reaches the city rooftops. You…","answers":[{"text":"Take the shortest jump between buildings.","weights":{"skill:stunt":2,"skill:dexterity":1,"attr:brawn":1,"trope:free_spirit":1}},{"text":"Read the traffic and choose a route.","weights":{"skill:drive":2,"skill:awareness":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Lose the pursuers in a crowd.","weights":{"skill:stealth":2,"skill:style":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Call out directions from above.","weights":{"skill:leadership":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}}]},{"id":"q18","prompt":"The enemy offers you a fortune to change sides. You…","answers":[{"text":"Ask what they are really buying.","weights":{"skill:detect":2,"skill:speech":1,"attr:focus":1,"trope:cheater":1}},{"text":"Take the money and plan the double-cross.","weights":{"skill:dexterity":2,"skill:style":1,"attr:crime":1,"trope:bad_to_the_bone":1}},{"text":"Refuse and make them regret asking.","weights":{"skill:cool":2,"skill:fight":1,"attr:nerves":1,"trope:diehard":1}},{"text":"Remind them who you are protecting.","weights":{"skill:leadership":2,"skill:flirt":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q19","prompt":"You have one minute to disable a security system. You…","answers":[{"text":"Hack it through the maintenance port.","weights":{"skill:fix":2,"skill:know":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Cut the right wire by instinct.","weights":{"skill:dexterity":2,"skill:awareness":1,"attr:crime":1,"trope:genius_bruiser":1}},{"text":"Hold the guards off while someone works.","weights":{"skill:shoot":2,"skill:cool":1,"attr:nerves":1,"trope:diehard":1}},{"text":"Convince the operator it is a drill.","weights":{"skill:speech":2,"skill:style":1,"attr:smooth":1,"trope:cheater":1}}]},{"id":"q20","prompt":"The floor gives way beneath you. You…","answers":[{"text":"Catch the ledge and pull yourself up.","weights":{"skill:force":2,"skill:endure":1,"attr:brawn":1,"trope:hunk":1}},{"text":"Swing to the next platform.","weights":{"skill:stunt":2,"skill:dexterity":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Notice the safe footing before stepping.","weights":{"skill:awareness":2,"skill:detect":1,"attr:crime":1,"trope:party_killer":1}},{"text":"Guide the others out before yourself.","weights":{"skill:leadership":2,"skill:heal":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q21","prompt":"The only witness is a child who refuses to speak. You…","answers":[{"text":"Give them time and a safe place.","weights":{"skill:heal":2,"skill:speech":1,"attr:smooth":1,"trope:good_samaritan":1}},{"text":"Find the detail they are trying to show you.","weights":{"skill:detect":2,"skill:know":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Ask a street contact who knows the family.","weights":{"skill:streetwise":2,"skill:leadership":1,"attr:crime":1,"trope:mentor":1}},{"text":"Promise the people responsible will answer.","weights":{"skill:cool":2,"skill:force":1,"attr:nerves":1,"trope:vigilante":1}}]},{"id":"q22","prompt":"Your weapon jams at the worst possible moment. You…","answers":[{"text":"Clear it and fire again.","weights":{"skill:fix":2,"skill:shoot":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Close the distance and use your fists.","weights":{"skill:fight":2,"skill:force":1,"attr:brawn":1,"trope:hunk":1}},{"text":"Duck away and find another angle.","weights":{"skill:stunt":2,"skill:stealth":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Make the enemy think it was deliberate.","weights":{"skill:style":2,"skill:speech":1,"attr:smooth":1,"trope:cool_but_distressed":1}}]},{"id":"q23","prompt":"A storm closes in as you cross the wilderness. You…","answers":[{"text":"Read the sky and alter course.","weights":{"skill:survival":2,"skill:awareness":1,"attr:nerves":1,"trope:lone_wolf":1}},{"text":"Build shelter and wait it out.","weights":{"skill:force":2,"skill:fix":1,"attr:brawn":1,"trope:last_boy_scout":1}},{"text":"Keep the group calm with a story.","weights":{"skill:speech":2,"skill:style":1,"attr:smooth":1,"trope:party_killer":1}},{"text":"Push on before the trail disappears.","weights":{"skill:endure":2,"skill:stunt":1,"attr:crime":1,"trope:diehard":1}}]},{"id":"q24","prompt":"Your disguise is almost perfect, but the doorman asks a personal question. You…","answers":[{"text":"Answer with a detail from your research.","weights":{"skill:know":2,"skill:speech":1,"attr:focus":1,"trope:cheater":1}},{"text":"Turn the question into a compliment.","weights":{"skill:flirt":2,"skill:style":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Give a different answer to each guard.","weights":{"skill:dexterity":2,"skill:stealth":1,"attr:crime":1,"trope:cheater":1}},{"text":"Walk past as if you belong there.","weights":{"skill:cool":2,"skill:leadership":1,"attr:nerves":1,"trope:leader":1}}]},{"id":"q25","prompt":"The villain traps your team in a burning warehouse. You…","answers":[{"text":"Find the structural weakness and open a path.","weights":{"skill:fix":2,"skill:force":1,"attr:focus":1,"trope:genius_bruiser":1}},{"text":"Carry the slowest teammate through the smoke.","weights":{"skill:endure":2,"skill:heal":1,"attr:brawn":1,"trope:good_samaritan":1}},{"text":"Leap across the loading bay.","weights":{"skill:stunt":2,"skill:survival":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Confront the villain while others escape.","weights":{"skill:fight":2,"skill:shoot":1,"attr:crime":1,"trope:vigilante":1}}]},{"id":"q26","prompt":"An encrypted file names the next target. You…","answers":[{"text":"Crack the cipher and trace the source.","weights":{"skill:fix":2,"skill:know":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Ask a contact for the missing context.","weights":{"skill:streetwise":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}},{"text":"Watch the target until their pattern breaks.","weights":{"skill:stealth":2,"skill:awareness":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Prepare a clean, direct intervention.","weights":{"skill:shoot":2,"skill:cool":1,"attr:nerves":1,"trope:diehard":1}}]},{"id":"q27","prompt":"The final door has no lock, handle, or visible seam. You…","answers":[{"text":"Search for the hidden mechanism.","weights":{"skill:detect":2,"skill:know":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Ask the building who made it.","weights":{"skill:streetwise":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}},{"text":"Try a forceful solution.","weights":{"skill:force":2,"skill:fight":1,"attr:brawn":1,"trope:hunk":1}},{"text":"Find another way around.","weights":{"skill:stunt":2,"skill:stealth":1,"attr:crime":1,"trope:lone_wolf":1}}]},{"id":"q28","prompt":"The team has one chance to expose the conspiracy. You…","answers":[{"text":"Put the evidence where everyone can see it.","weights":{"skill:style":2,"skill:speech":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Line up the shot that ends the threat.","weights":{"skill:shoot":2,"skill:awareness":1,"attr:nerves":1,"trope:cool_but_distressed":1}},{"text":"Build the case piece by piece.","weights":{"skill:detect":2,"skill:know":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Break into the archive and take the proof.","weights":{"skill:dexterity":2,"skill:stealth":1,"attr:crime":1,"trope:cheater":1}}]},{"id":"q29","prompt":"The getaway route is blocked by a barricade. You…","answers":[{"text":"Ram it with the ride.","weights":{"skill:drive":2,"skill:force":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Climb over before anyone notices.","weights":{"skill:stunt":2,"skill:dexterity":1,"attr:brawn":1,"trope:free_spirit":1}},{"text":"Talk the crew into opening a gap.","weights":{"skill:speech":2,"skill:leadership":1,"attr:smooth":1,"trope:cheater":1}},{"text":"Disappear into the side streets.","weights":{"skill:streetwise":2,"skill:survival":1,"attr:crime":1,"trope:cheater":1}}]},{"id":"q30","prompt":"At the showdown, the villain offers one last warning. You…","answers":[{"text":"Listen for the weakness in the speech.","weights":{"skill:detect":2,"skill:cool":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Step forward and refuse to yield.","weights":{"skill:endure":2,"skill:fight":1,"attr:brawn":1,"trope:diehard":1}},{"text":"Turn the crowd against them.","weights":{"skill:leadership":2,"skill:speech":1,"attr:smooth":1,"trope:leader":1}},{"text":"Take the shot nobody else can make.","weights":{"skill:shoot":2,"skill:awareness":1,"attr:nerves":1,"trope:bad_to_the_bone":1}}]}]'),f_={_meta:c_ ill your Bad Box, gain 1 Power and +1 to your next roll."},"heartbreaker":{"name":"Heartbreaker","pageRef":95,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll when seducing or making a good impression."},"immortality":{"name":"Immortality","pageRef":95,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"When Left for Dead, appear dead and flip a coin once per Turn; on Tails, return with 1 Grit and remove one Condition. Reassembling after dismemberment or burial takes two days."},"incorporeal":{"name":"Incorporeal","pageRef":96,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"Move through a wall, floor, or other solid surface as air. Phase Shift lets you spend 1 Power to become incorporeal instantly or automatically dodge one melee attack.","specialActions":[{"name":"Phase Shift","cost":1,"summary":"Become incorporeal instantly or automatically dodge one melee attack."}]},"invisible":{"name":"Invisible","pageRef":96,"source":"Outgunned Superheroes ENG 1.0","activation":"quick_action","summary":"Turn invisible or visible as a Quick Action; while invisible, gain Help to avoid detection and can make an Enemy lose track of you and skip its next Reaction Turn if you do not attack. Visibility ends after losing 2+ Grit in one hit, suffering a Condition, or choosing to end it."},"jump":{"name":"Jump","pageRef":96,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Make very long/high jumps and never lose Grit from falling. Leap Attack costs 1 Power to attack a distant or flying Enemy as if in melee with +1 and a Free Re-roll.","specialActions":[{"name":"Leap Attack","cost":1,"summary":"Attack a distant or flying Enemy as melee with +1 and a Free Re-roll."}]},"lord_of_the_seas":{"name":"Lord of the Seas","pageRef":96,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"In water, gain a Free Re-roll to all rolls, Help to swim, underwater breathing, and communication with fish and other sea creatures. Call of the Sea costs 1 Power to bring sea creatures to Help.","specialActions":[{"name":"Call of the Sea","activation":"quick_action","cost":1,"summary":"Call one or more nearby sea creatures to Help."}]},"mind_control":{"name":"Mind Control","pageRef":97,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to persuade someone to cooperate or help. Puppet costs 1 Power to control a supporting character for a Full Turn; control ends on lost Grit, a Condition, or lost focus. Controlling an Enemy requires an Action Roll against its Defense.","specialActions":[{"name":"Puppet","activation":"full_turn","cost":1,"summary":"Control a supporting character's movement, but not actions that harm them; an Enemy requires a roll against Defense."}]},"monster":{"name":"Monster","pageRef":97,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Your non-human appearance gives a Hindrance when interacting with unfamiliar people but a Help to intimidate."},"multiple_hero":{"name":"Multiple Hero","pageRef":97,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"Create copies. Roll Smooth+Endure: one copy per Basic Success, three per Critical, nine per Extreme. Copies take only a small Quick Action, each counts as one Grit, and can be sacrificed to prevent equal Grit loss. They dissolve when hit, too far away, dismissed, Powerless, or at Scene end; then you become Tired or Broken.","specialActions":[{"name":"Multiplication","activation":"full_turn","summary":"Roll Smooth+Endure to create copies using the success conversion above."}]},"new_powers":{"name":"New Powers","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a new Superpower except Invincible or One of a Kind, when it makes sense in the story and all Players agree."},"only_weakness":{"name":"Only Weakness","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Choose a weakness (or let the Director choose). Exposure causes Powerless. At character creation, this Feat grants another Feat; it does not grant one when gained from Invincible."},"personal_ai":{"name":"Personal A.I.","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"An A.I. in your suit or accessory, or a hyperdeveloped A.I., answers general knowledge questions, tracks nearby Enemies, and gives Help to analyze a city's or building's layout for an escape route."},"phd":{"name":"PhD","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Choose a field of study and gain a Free Re-roll for rolls concerning that specialty."},"pint_sized":{"name":"Pint-sized","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"At roughly half human height, gain a Free Re-roll to Stealth or dodging projectiles, and Help to squeeze through narrow spaces or go unnoticed."},"power_absorption":{"name":"Power Absorption","pageRef":99,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"Touch a powered ally to steal their Superpower and connected Feats until Scene end while they become Powerless; an Enemy must be disabled for one Turn and the Director determines stolen extent.","specialActions":[{"name":"Stolen Power","activation":"full_turn","summary":"Touch an ally or disabled Enemy to temporarily copy their powers; an ally becomes Powerless."}]},"power_mirror":{"name":"Power-Mirror","pageRef":100,"source":"Outgunned Superheroes ENG 1.0","activation":"quick_action","cost":1,"summary":"Touch a powered person to immediately use one of their special actions or temporarily gain their Superpower's benefits. During a Time-Out, an action can help a friend Show Off their Superpower.","specialActions":[{"name":"Borrowed Power","activation":"quick_action","cost":1,"summary":"Copy one special action or temporarily gain a touched person's Superpower benefits."}]},"prep_time":{"name":"Prep Time","pageRef":100,"source":"Outgunned Superheroes ENG 1.0","activation":"session","summary":"Once per Session, ask the Director for information about a person or place. Once per combat after an Enemy reveals a Feat, spend 1 Power to counter it until Scene end.","specialActions":[{"name":"Prepared","cost":1,"summary":"After an Enemy reveals a Feat, make it unavailable until Scene end."}]},"proven_driver":{"name":"Proven Driver","pageRef":100,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Choose a ride type and gain a Free Re-roll to drive, repair, or evaluate that type."},"regeneration":{"name":"Regeneration","pageRef":101,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Whenever an Enemy or physical danger would make you lose 3+ Grit, lose 1 less. Fast Recovery costs 1 Power to recover 3 Grit or remove Tired/Hurt.","specialActions":[{"name":"Fast Recovery","activation":"quick_action","cost":1,"summary":"Recover 3 Grit or remove Tired or Hurt."}]},"shrinkage":{"name":"Shrinkage","pageRef":101,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"Shrink to tiny size without losing strength; while shrunk gain Help to squeeze through spaces or go unnoticed. Instant Miniaturization costs 1 Power to shrink immediately, escape a grapple/restraints, or automatically succeed at a relevant Reaction Roll. Instant Enlargement costs 1 Power to return to normal and attack with +1 and a Free Re-roll.","specialActions":[{"name":"Instant Miniaturization","cost":1,"summary":"Shrink immediately, escape restraints, or automatically succeed at a relevant Reaction Roll."},{"name":"Instant Enlargement","cost":1,"summary":"Return to normal size and attack with +1 and a Free Re-roll."}]},"silver_tongue":{"name":"Silver Tongue","pageRef":101,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to lie, persuade, compromise, or bargain."},"sonic_boom":{"name":"Sonic Boom","pageRef":101,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Use your voice or sonic waves to destroy objects and barriers; gain Sonic Wave. Choose twice to add Maximum Power.","superWeapons":["sonic_wave"],"repeatable":true,"maxRanks":2},"speak_with_animals":{"name":"Speak with Animals","pageRef":102,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Understand and speak with animals. Call of the Wild costs 1 Power as a Quick Action to call nearby animals to Help.","specialActions":[{"name":"Call of the Wild","activation":"quick_action","cost":1,"summary":"Call nearby animals to Help."}]},"super_senses":{"name":"Super Senses","pageRef":102,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to combat Reaction Rolls and rolls to sense danger, prevent ambush, or spot lurking Enemies. Attention costs 1 Power to repeat a failed Detect or Awareness Roll.","specialActions":[{"name":"Attention","cost":1,"summary":"Repeat a failed Detect or Awareness Roll."}]},"super_ride":{"name":"Super-Ride","pageRef":102,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a hyper-technological, magical, or alien ride and a Free Re-roll to drive it. Ride Recall costs 1 Power as a Quick Action to summon it.","specialActions":[{"name":"Ride Recall","activation":"quick_action","cost":1,"summary":"Recall or summon your super-ride."}]},"team_leader":{"name":"Team Leader","pageRef":102,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to inspire/coordinate and remove Like a Fool or Defeated. When Heroes assemble, a speech raises starting Teamwork to 2."},"trained_fighter":{"name":"Trained Fighter","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Choose a fighting style or melee weapon and gain a Free Re-roll for all Action and Reaction Rolls using it."},"transformation":{"name":"Transformation","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"You have a human form without your Superpower or connected Feats and a powered form with all sheet powers/Feats. On transforming, move one Attribute Point. Quick Shift costs 1 Power to transform as a Quick Action and recover all Grit.","specialActions":[{"name":"Quick Shift","activation":"quick_action","cost":1,"summary":"Transform quickly and recover all Grit."}]},"unlimited_funds":{"name":"Unlimited Funds","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"At creation, spend up to 10 Cash on gear instead of 4 and start with 5 Cash. Once per Session, leverage your wealth for an exclusive service such as a private jet, gala access, hotel, or restaurant."},"unstoppable_force":{"name":"Unstoppable Force","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"quick_action","cost":1,"summary":"Gain +1 to your next combat Action Roll; on a hit, the Enemy loses 1 extra Grit. Combine with other special actions such as Smash or Explosive Force.","specialActions":[{"name":"Devastating Attack","activation":"quick_action","cost":1,"summary":"Gain +1 to the next combat Action Roll and deal +1 Grit on a hit."}]},"wall_climber":{"name":"Wall-Climber","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Move on walls and ceilings and gain a Free Re-roll to climb."}}`),F_={arcane_powers:{name:"Arcane Powers",pageRef:74,source:"Outgunned Superheroes ENG 1.0",summary:"Magic can summon small everyday objects, make illusions, move unsecured objects telekinetically, and create astral projections. Complex or tiring uses roll Smooth+Leadership with a Director-set difficulty and a Free Re-roll.",startingPower:2,specialActions:[{name:"Astral Projection",activation:"full_turn",cost:1,summary:"Create a light projection that can float, turn invisible, pass through solids, and see, hear, and speak; the body stays still and the projection ends if focus is lost, you are struck, or wounded."}],choice:"Choose Magical Weapon or Arcane Missile; the pure-light weapon can be summoned or dismissed."},battleborn:{name:"Battleborn",pageRef:75,source:"Outgunned Superheroes ENG 1.0",summary:"Choose bows, guns, or melee weapons. Gain a Free Re-roll to use, repair, evaluate, or handle that type, plus the matching weapon benefit.",choices:{guns:"Gain 2 Guns and 6 Mags for free; reload once per Turn without an action; firing two guns at once gives +1.",bows:"Gain a Bow and 24 arrows for free; +1 to shoot arrows, and after spending a Turn aiming gain another +1 to the next arrow shot.",melee_weapons:"Gain one weapon or a pair of the chosen type for free with Perfect; +1 to fight with it, and a same-type pair gives +1 to dodge projectiles."}},dark_presence:{name:"Dark Presence",pageRef:75,source:"Outgunned Superheroes ENG 1.0",summary:"Gain a Free Re-roll to all Crime rolls and +1 to ambush or strike unaware Enemies.",specialActions:[{name:"Vanish",activation:"quick_action",cost:1,summary:"Hide, escape a difficult situation, break a grapple, or reach Partial/Total Cover; spend another Power that Turn to reappear nearby in sight."}]},elemental_control:{name:"Elemental Control",pageRef:76,source:"Outgunned Superheroes ENG 1.0",summary:"Choose Water, Electricity, Fire, Ice, Storm, Earth, or Wind. Complex or tiring uses roll against a Director-set difficulty; simple uses need no roll and extraordinary uses may cost Power. While not Powerless, you are immune to your element's damage and gain Elemental Ray.",elements:{water:"Pushes things, puts out fires, and breaks barriers.",electricity:"Destroys obstacles and overloads technology.",fire:"Burns wood and fabric, scares people, and keeps enemies away.",ice:"Freezes, makes surfaces slippery, and creates barriers.",storm:"Controls weather and generates lightning.",earth:"Builds platforms and barriers.",wind:"Pushes objects and people and blows out flames."},specialActions:[{name:"Elemental Form",activation:"quick_action",cost:1,summary:"Until combat or the Scene ends, fly as with Flight and gain a Free Re-roll when using the element or Elemental Ray."}],superWeapons:["elemental_ray"]},enhanced_body:{name:"Enhanced Body",pageRef:76,source:"Outgunned Superheroes ENG 1.0",summary:"Gain a Free Re-roll to all Brawn rolls and automatically gain Trained Fighter.",specialActions:[{name:"I Can Do This All Day",activation:"free",summary:"Once per Scene, when losing more than 3 Grit at once, gain 1 Power."}]},force_control:{name:"Force Control",pageRef:77,source:"Outgunned Superheroes ENG 1.0",summary:"Choose Cosmic Force or Electromagnetic Force. Cosmic Force makes flying platforms, moves small unsecured items, opens unreachable doors, and creates Partial-Cover shields as a Quick Action. Electromagnetic Force controls ferromagnetic metals; complex or tiring uses roll Focus+Cool with a Free Re-roll. Simple uses need no roll; very heavy, anchored, or large uses may cost Power.",choices:{cosmic_force:"Create human-bearing flying platforms, move small items telekinetically, open untouchable doors, and make small Partial-Cover shields as a Quick Action.",electromagnetic_force:"Telekinetically control iron, steel, and other ferromagnetic metals; complex or tiring uses are Focus+Cool with a Free Re-roll."}},hyper_technological_armor:{name:"Hyper-technological Armor",pageRef:78,source:"Outgunned Superheroes ENG 1.0",summary:"Putting on the armor takes a Full Turn. While wearing it, Brawn is always 3, Hurt penalties are ignored, and you can fly, breathe underwater and in space, and use the Energy Beam super-weapon. Gain a Free Re-roll to shoot Energy Beam and ranged weapons added to the armor.",superWeapons:["energy_beam"],specialActions:[{name:"Recall",activation:"quick_action",cost:1,summary:"When near or in the open, call the armor to fly onto your body."}]},incredible_strength:{name:"Incredible Strength",pageRef:78,source:"Outgunned Superheroes ENG 1.0",summary:"Gain +1 to Force and Endure rolls, ignore Brawn -1 penalties and Conditions while not Powerless, and always gain Help to crash, lift, throw, or break things. You suffer a Hindrance to go unnoticed or fit in narrow spaces. An always-active power grants Monster; a reversible transformation grants Transformation.",specialActions:[{name:"Smash",activation:"instant",summary:"Destroy an object or ride, or gain +2 to a Brawn roll."}]},invincible:{name:"Invincible",pageRef:79,source:"Outgunned Superheroes ENG 1.0",summary:"Gain a Free Re-roll to all Brawn rolls and the Flight, Energy Manipulation, Bulletproof, and Only Weakness Feats. Assign 6 extra Skill Points (in addition to the normal 2 free points). Only the Marvel can gain this power.",restriction:"Marvel Role only",grantedFeats:["flight","energy_manipulation","bulletproof","only_weakness"],extraSkillPoints:6},kinetic_energy:{name:"Kinetic Energy",pageRef:80,source:"Outgunned Superheroes ENG 1.0",summary:"Focus kinetic energy through part of your body and release it as a destructive beam. Gain Kinetic Ray and +1 plus a Free Re-roll to shoot it.",superWeapons:["kinetic_ray"],specialActions:[{name:"Explosive Force",activation:"instant",summary:"Gain +1 to Kinetic Ray attacks and temporarily give it Explosive."}]},mind_powers:{name:"Mind Powers",pageRef:80,source:"Outgunned Superheroes ENG 1.0",summary:"Communicate telepathically across languages, move objects telekinetically, create illusions, read thoughts, and locate people you know with Focus+Detect. Complex or tiring uses roll Focus+Endure with a Free Re-roll; simple uses need no roll and extreme uses may cost Power.",specialActions:[{name:"Whisper",activation:"quick_action",cost:1,summary:"Persuade a non-hostile individual or confuse an Enemy, giving one ally +1 during combat."}]},natural_predator:{name:"Natural Predator",pageRef:81,source:"Outgunned Superheroes ENG 1.0",summary:"Gain a Free Re-roll to Awareness and tracking rolls; gain retractable Claws, which attack with +1, and choose Acrobat, Wall-Climber, or Bulletproof for free.",superWeapons:["claws"],grantedFeatsChoice:["acrobat","wall_climber","bulletproof"]},one_of_a_kind:{name:"One of a Kind",pageRef:81,source:"Outgunned Superheroes ENG 1.0",summary:"Choose one Superpower and one Feat, or two Feats, from all available options; Invincible is excluded unless essential and unanimously accepted. Assign 2 extra Skill Points (in addition to the normal 2 free points). Prodigy Role only.",restriction:"Prodigy Role only",extraSkillPoints:2},shapeshift:{name:"Shapeshift",pageRef:82,source:"Outgunned Superheroes ENG 1.0",summary:"Choose Humanoid, Animal, or Elastic Shapeshifter. Humanoid and Animal forms change appearance without changing base Skills and can be situational Help/Hindrance; each takes a Full Turn. Elastic form gains Help to squeeze, catch/trap, or dodge bullets, plus one extra Quick Action each Turn, and can expand with a Full Turn.",choices:{humanoid:"Become any humanoid with completely changed appearance and voice.",animal:"Become an animal of any kind.",elastic:"Stretch and reshape like rubber, gain the listed Help and extra Quick Action, and inflate/stretch to increase size."},specialActions:[{name:"Quick-Change",activation:"quick_action",summary:"Transform without spending a Full Turn."}]},specialty:{name:"Specialty",pageRef:82,source:"Outgunned Superheroes ENG 1.0",summary:"Choose one extra Feat of any kind; that Feat is your Superpower. Start with 2 Spotlights instead of 1.",specialActions:[{name:"Underdog",activation:"instant",summary:"Repeat any roll while ignoring penalties from Conditions other than Powerless."}]},super_speed:{name:"Super-Speed",pageRef:83,source:"Outgunned Superheroes ENG 1.0",summary:"Gain a Free Re-roll to run, +2 to chase, escape, or beat others to something, and one additional Quick Action each Turn.",specialActions:[{name:"Be Right Back",activation:"full_turn",summary:"Reach a runnable spot, retrieve or leave an object, and return without spending Power."},{name:"In a Flash",activation:"quick_action",cost:1,frequency:"once per Turn",summary:"If unobstructed, run to a known place to take/leave an object or person, leave combat and range, change clothes or put on a suit, automatically succeed at a Reaction Roll, or make a second Action Roll at -1 without Free Re-rolls."}]},teleportation:{name:"Teleportation",pageRef:83,source:"Outgunned Superheroes ENG 1.0",summary:"Teleport at will to any visible place. Outside danger, a Full Turn can take you to a familiar or visited place anywhere on the planet; distant jumps may cost Power. Gain a Free Re-roll to combat Reaction Rolls unless surprised.",specialActions:[{name:"Round Trip",activation:"quick_action",cost:1,summary:"Teleport to a known visible place, grab something, and return immediately."},{name:"Group Teleport",activation:"quick_action",cost:1,summary:"Teleport yourself and one other person."}]}},E_={alien:{name:"Alien",pageRef:19,source:"Outgunned Superheroes ENG 1.0",summary:"Your powers come from being an alien or carrying an alien parasite."},arcane:{name:"Arcane",pageRef:19,source:"Outgunned Superheroes ENG 1.0",summary:"You were born with, taught, or granted mystical powers."},divine:{name:"Divine",pageRef:19,source:"Outgunned Superheroes ENG 1.0",summary:"You are a god's avatar or possess divine powers."},eternal:{name:"Eternal",pageRef:19,source:"Outgunned Superheroes ENG 1.0",summary:"Your power comes from the Eternity Shards."},evolved:{name:"Evolved",pageRef:19,source:"Outgunned Superheroes ENG 1.0",summary:"Your powers developed naturally, such as during puberty."},experiment:{name:"Experiment",pageRef:19,source:"Outgunned Superheroes ENG 1.0",summary:"You are the result of a scientific experiment."},mutation:{name:"Mutation",pageRef:19,source:"Outgunned Superheroes ENG 1.0",summary:"An extraordinary creature or acc
