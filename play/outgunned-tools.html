 building. You…","answers":[{"text":"Shoulder it off its hinges.","weights":{"skill:force":2,"attr:brawn":1,"trope:hunk":1}},{"text":"Study the lock and work it quietly.","weights":{"skill:dexterity":2,"skill:fix":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Find a staff entrance and blend in.","weights":{"skill:stealth":2,"skill:style":1,"attr:crime":1,"trope:cheater":1}},{"text":"Make a confident request of the guard.","weights":{"skill:speech":2,"skill:leadership":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q03","prompt":"Your contact has sold you out. The room goes silent. You…","answers":[{"text":"Keep your cool and watch every exit.","weights":{"skill:cool":2,"skill:awareness":1,"attr:nerves":1,"trope:lone_wolf":1}},{"text":"Put them on the spot with a hard question.","weights":{"skill:detect":2,"skill:streetwise":1,"attr:focus":1,"trope:party_killer":1}},{"text":"Smile, flirt, and turn the betrayal around.","weights":{"skill:flirt":2,"skill:speech":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Hit first and ask questions later.","weights":{"skill:fight":2,"skill:force":1,"attr:brawn":1,"trope:jerk_with_a_heart_of_gold":1}}]},{"id":"q04","prompt":"The team is lost in unfamiliar country before sunrise. You…","answers":[{"text":"Read the terrain and make a route.","weights":{"skill:survival":2,"skill:awareness":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Ask locals the right questions.","weights":{"skill:streetwise":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}},{"text":"Repair the radio and call for coordinates.","weights":{"skill:fix":2,"skill:know":1,"attr:focus":1,"trope:genius_bruiser":1}},{"text":"Lead everyone onward, no matter the weather.","weights":{"skill:leadership":2,"skill:endure":1,"attr:nerves":1,"trope:leader":1}}]},{"id":"q05","prompt":"A rival draws a weapon in a crowded station. You…","answers":[{"text":"Spot the threat before anyone else does.","weights":{"skill:awareness":2,"skill:detect":1,"attr:crime":1,"trope:party_killer":1}},{"text":"Take the hit and keep moving.","weights":{"skill:endure":2,"skill:fight":1,"attr:brawn":1,"trope:last_boy_scout":1}},{"text":"Slip behind the nearest pillar.","weights":{"skill:stealth":2,"skill:stunt":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Get the crowd safely out of the way.","weights":{"skill:heal":2,"skill:leadership":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q06","prompt":"The safe contains a timer, a map, and three unlabeled keys. You…","answers":[{"text":"Test the mechanism until it makes sense.","weights":{"skill:fix":2,"skill:know":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Pocket the keys and improvise.","weights":{"skill:dexterity":2,"skill:streetwise":1,"attr:crime":1,"trope:cheater":1}},{"text":"Call the shot and pick a key.","weights":{"skill:cool":2,"skill:detect":1,"attr:nerves":1,"trope:party_killer":1}},{"text":"Force the safe open before the timer wins.","weights":{"skill:force":2,"skill:stunt":1,"attr:brawn":1,"trope:hunk":1}}]},{"id":"q07","prompt":"A helicopter offers one seat out of the collapsing compound. You…","answers":[{"text":"Take the controls and fly.","weights":{"skill:drive":2,"skill:awareness":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Put the most injured person aboard.","weights":{"skill:heal":2,"skill:leadership":1,"attr:smooth":1,"trope:good_samaritan":1}},{"text":"Find another route through the wreckage.","weights":{"skill:stunt":2,"skill:survival":1,"attr:brawn":1,"trope:vigilante":1}},{"text":"Stay behind to cover the retreat.","weights":{"skill:shoot":2,"skill:endure":1,"attr:crime":1,"trope:diehard":1}}]},{"id":"q08","prompt":"Your mark invites you to a gala. You prepare by…","answers":[{"text":"Learning every name and piece of gossip.","weights":{"skill:know":2,"skill:detect":1,"attr:focus":1,"trope:mentor":1}},{"text":"Choosing an outfit nobody can forget.","weights":{"skill:style":2,"skill:flirt":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Planning three exits and a fallback.","weights":{"skill:awareness":2,"skill:fix":1,"attr:crime":1,"trope:leader":1}},{"text":"Bringing the perfect concealed weapon.","weights":{"skill:shoot":2,"skill:dexterity":1,"attr:nerves":1,"trope:bad_to_the_bone":1}}]},{"id":"q09","prompt":"A teammate freezes during the firefight. You…","answers":[{"text":"Shout an order they can follow.","weights":{"skill:leadership":2,"skill:speech":1,"attr:smooth":1,"trope:leader":1}},{"text":"Drag them behind cover.","weights":{"skill:force":2,"skill:endure":1,"attr:brawn":1,"trope:trusty_sidekick":1}},{"text":"Create a diversion and draw the fire away.","weights":{"skill:stunt":2,"skill:cool":1,"attr:nerves":1,"trope:trusty_sidekick":1}},{"text":"Treat the wound when the shooting stops.","weights":{"skill:heal":2,"skill:fix":1,"attr:focus":1,"trope:good_samaritan":1}}]},{"id":"q10","prompt":"You need information from a hostile witness. You…","answers":[{"text":"Offer a deal they cannot refuse.","weights":{"skill:speech":2,"skill:flirt":1,"attr:smooth":1,"trope:cheater":1}},{"text":"Notice the lie behind their story.","weights":{"skill:detect":2,"skill:know":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Find the pressure point and lean on it.","weights":{"skill:streetwise":2,"skill:awareness":1,"attr:crime":1,"trope:jerk_with_a_heart_of_gold":1}},{"text":"Wait them out without blinking.","weights":{"skill:cool":2,"skill:endure":1,"attr:nerves":1,"trope:lone_wolf":1}}]},{"id":"q11","prompt":"The bridge ahead has washed out. You…","answers":[{"text":"Build a crossing from whatever is nearby.","weights":{"skill:fix":2,"skill:force":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Jump it at a run.","weights":{"skill:stunt":2,"skill:survival":1,"attr:brawn":1,"trope:free_spirit":1}},{"text":"Find the quietest path around.","weights":{"skill:awareness":2,"skill:stealth":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Get the others across first.","weights":{"skill:leadership":2,"skill:heal":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q12","prompt":"A guard recognizes your face at the checkpoint. You…","answers":[{"text":"Give them a new name and a straight story.","weights":{"skill:speech":2,"skill:style":1,"attr:smooth":1,"trope:cheater":1}},{"text":"Slip away while their radio crackles.","weights":{"skill:stealth":2,"skill:dexterity":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Drive straight through the barrier.","weights":{"skill:drive":2,"skill:force":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Tell them exactly why they should let you pass.","weights":{"skill:leadership":2,"skill:cool":1,"attr:focus":1,"trope:good_samaritan":1}}]},{"id":"q13","prompt":"The villain leaves a coded message. You…","answers":[{"text":"Spot the pattern in the numbers.","weights":{"skill:know":2,"skill:detect":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Search the room for the missing piece.","weights":{"skill:awareness":2,"skill:stealth":1,"attr:crime":1,"trope:cool_but_distressed":1}},{"text":"Ask who benefits from the threat.","weights":{"skill:streetwise":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}},{"text":"Destroy it and make your own message.","weights":{"skill:style":2,"skill:stunt":1,"attr:nerves":1,"trope:vigilante":1}}]},{"id":"q14","prompt":"Your ride is surrounded in a parking garage. You…","answers":[{"text":"Punch the accelerator and take the ramp.","weights":{"skill:drive":2,"skill:stunt":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Fight your way to the nearest exit.","weights":{"skill:fight":2,"skill:force":1,"attr:brawn":1,"trope:genius_bruiser":1}},{"text":"Talk one attacker into opening a lane.","weights":{"skill:speech":2,"skill:flirt":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Disappear between the concrete pillars.","weights":{"skill:stealth":2,"skill:awareness":1,"attr:crime":1,"trope:lone_wolf":1}}]},{"id":"q15","prompt":"The mission plan is falling apart. You…","answers":[{"text":"Rewrite it on the spot.","weights":{"skill:know":2,"skill:fix":1,"attr:focus":1,"trope:leader":1}},{"text":"Keep everyone moving forward.","weights":{"skill:leadership":2,"skill:cool":1,"attr:nerves":1,"trope:leader":1}},{"text":"Follow your instincts and improvise.","weights":{"skill:survival":2,"skill:stunt":1,"attr:brawn":1,"trope:free_spirit":1}},{"text":"Make the hard call nobody else will.","weights":{"skill:detect":2,"skill:shoot":1,"attr:crime":1,"trope:party_killer":1}}]},{"id":"q16","prompt":"A wounded stranger asks for help during your escape. You…","answers":[{"text":"Stop and patch them up.","weights":{"skill:heal":2,"skill:endure":1,"attr:focus":1,"trope:good_samaritan":1}},{"text":"Carry them until the danger passes.","weights":{"skill:force":2,"skill:survival":1,"attr:brawn":1,"trope:last_boy_scout":1}},{"text":"Promise to return with help.","weights":{"skill:speech":2,"skill:leadership":1,"attr:smooth":1,"trope:trusty_sidekick":1}},{"text":"Check whether this is a trap first.","weights":{"skill:awareness":2,"skill:detect":1,"attr:crime":1,"trope:party_killer":1}}]},{"id":"q17","prompt":"A chase reaches the city rooftops. You…","answers":[{"text":"Take the shortest jump between buildings.","weights":{"skill:stunt":2,"skill:dexterity":1,"attr:brawn":1,"trope:free_spirit":1}},{"text":"Read the traffic and choose a route.","weights":{"skill:drive":2,"skill:awareness":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Lose the pursuers in a crowd.","weights":{"skill:stealth":2,"skill:style":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Call out directions from above.","weights":{"skill:leadership":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}}]},{"id":"q18","prompt":"The enemy offers you a fortune to change sides. You…","answers":[{"text":"Ask what they are really buying.","weights":{"skill:detect":2,"skill:speech":1,"attr:focus":1,"trope:cheater":1}},{"text":"Take the money and plan the double-cross.","weights":{"skill:dexterity":2,"skill:style":1,"attr:crime":1,"trope:bad_to_the_bone":1}},{"text":"Refuse and make them regret asking.","weights":{"skill:cool":2,"skill:fight":1,"attr:nerves":1,"trope:diehard":1}},{"text":"Remind them who you are protecting.","weights":{"skill:leadership":2,"skill:flirt":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q19","prompt":"You have one minute to disable a security system. You…","answers":[{"text":"Hack it through the maintenance port.","weights":{"skill:fix":2,"skill:know":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Cut the right wire by instinct.","weights":{"skill:dexterity":2,"skill:awareness":1,"attr:crime":1,"trope:genius_bruiser":1}},{"text":"Hold the guards off while someone works.","weights":{"skill:shoot":2,"skill:cool":1,"attr:nerves":1,"trope:diehard":1}},{"text":"Convince the operator it is a drill.","weights":{"skill:speech":2,"skill:style":1,"attr:smooth":1,"trope:cheater":1}}]},{"id":"q20","prompt":"The floor gives way beneath you. You…","answers":[{"text":"Catch the ledge and pull yourself up.","weights":{"skill:force":2,"skill:endure":1,"attr:brawn":1,"trope:hunk":1}},{"text":"Swing to the next platform.","weights":{"skill:stunt":2,"skill:dexterity":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Notice the safe footing before stepping.","weights":{"skill:awareness":2,"skill:detect":1,"attr:crime":1,"trope:party_killer":1}},{"text":"Guide the others out before yourself.","weights":{"skill:leadership":2,"skill:heal":1,"attr:smooth":1,"trope:good_samaritan":1}}]},{"id":"q21","prompt":"The only witness is a child who refuses to speak. You…","answers":[{"text":"Give them time and a safe place.","weights":{"skill:heal":2,"skill:speech":1,"attr:smooth":1,"trope:good_samaritan":1}},{"text":"Find the detail they are trying to show you.","weights":{"skill:detect":2,"skill:know":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Ask a street contact who knows the family.","weights":{"skill:streetwise":2,"skill:leadership":1,"attr:crime":1,"trope:mentor":1}},{"text":"Promise the people responsible will answer.","weights":{"skill:cool":2,"skill:force":1,"attr:nerves":1,"trope:vigilante":1}}]},{"id":"q22","prompt":"Your weapon jams at the worst possible moment. You…","answers":[{"text":"Clear it and fire again.","weights":{"skill:fix":2,"skill:shoot":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Close the distance and use your fists.","weights":{"skill:fight":2,"skill:force":1,"attr:brawn":1,"trope:hunk":1}},{"text":"Duck away and find another angle.","weights":{"skill:stunt":2,"skill:stealth":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Make the enemy think it was deliberate.","weights":{"skill:style":2,"skill:speech":1,"attr:smooth":1,"trope:cool_but_distressed":1}}]},{"id":"q23","prompt":"A storm closes in as you cross the wilderness. You…","answers":[{"text":"Read the sky and alter course.","weights":{"skill:survival":2,"skill:awareness":1,"attr:nerves":1,"trope:lone_wolf":1}},{"text":"Build shelter and wait it out.","weights":{"skill:force":2,"skill:fix":1,"attr:brawn":1,"trope:last_boy_scout":1}},{"text":"Keep the group calm with a story.","weights":{"skill:speech":2,"skill:style":1,"attr:smooth":1,"trope:party_killer":1}},{"text":"Push on before the trail disappears.","weights":{"skill:endure":2,"skill:stunt":1,"attr:crime":1,"trope:diehard":1}}]},{"id":"q24","prompt":"Your disguise is almost perfect, but the doorman asks a personal question. You…","answers":[{"text":"Answer with a detail from your research.","weights":{"skill:know":2,"skill:speech":1,"attr:focus":1,"trope:cheater":1}},{"text":"Turn the question into a compliment.","weights":{"skill:flirt":2,"skill:style":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Give a different answer to each guard.","weights":{"skill:dexterity":2,"skill:stealth":1,"attr:crime":1,"trope:cheater":1}},{"text":"Walk past as if you belong there.","weights":{"skill:cool":2,"skill:leadership":1,"attr:nerves":1,"trope:leader":1}}]},{"id":"q25","prompt":"The villain traps your team in a burning warehouse. You…","answers":[{"text":"Find the structural weakness and open a path.","weights":{"skill:fix":2,"skill:force":1,"attr:focus":1,"trope:genius_bruiser":1}},{"text":"Carry the slowest teammate through the smoke.","weights":{"skill:endure":2,"skill:heal":1,"attr:brawn":1,"trope:good_samaritan":1}},{"text":"Leap across the loading bay.","weights":{"skill:stunt":2,"skill:survival":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Confront the villain while others escape.","weights":{"skill:fight":2,"skill:shoot":1,"attr:crime":1,"trope:vigilante":1}}]},{"id":"q26","prompt":"An encrypted file names the next target. You…","answers":[{"text":"Crack the cipher and trace the source.","weights":{"skill:fix":2,"skill:know":1,"attr:focus":1,"trope:neurotic_geek":1}},{"text":"Ask a contact for the missing context.","weights":{"skill:streetwise":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}},{"text":"Watch the target until their pattern breaks.","weights":{"skill:stealth":2,"skill:awareness":1,"attr:crime":1,"trope:lone_wolf":1}},{"text":"Prepare a clean, direct intervention.","weights":{"skill:shoot":2,"skill:cool":1,"attr:nerves":1,"trope:diehard":1}}]},{"id":"q27","prompt":"The final door has no lock, handle, or visible seam. You…","answers":[{"text":"Search for the hidden mechanism.","weights":{"skill:detect":2,"skill:know":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Ask the building who made it.","weights":{"skill:streetwise":2,"skill:speech":1,"attr:smooth":1,"trope:mentor":1}},{"text":"Try a forceful solution.","weights":{"skill:force":2,"skill:fight":1,"attr:brawn":1,"trope:hunk":1}},{"text":"Find another way around.","weights":{"skill:stunt":2,"skill:stealth":1,"attr:crime":1,"trope:lone_wolf":1}}]},{"id":"q28","prompt":"The team has one chance to expose the conspiracy. You…","answers":[{"text":"Put the evidence where everyone can see it.","weights":{"skill:style":2,"skill:speech":1,"attr:smooth":1,"trope:hot_stuff":1}},{"text":"Line up the shot that ends the threat.","weights":{"skill:shoot":2,"skill:awareness":1,"attr:nerves":1,"trope:cool_but_distressed":1}},{"text":"Build the case piece by piece.","weights":{"skill:detect":2,"skill:know":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Break into the archive and take the proof.","weights":{"skill:dexterity":2,"skill:stealth":1,"attr:crime":1,"trope:cheater":1}}]},{"id":"q29","prompt":"The getaway route is blocked by a barricade. You…","answers":[{"text":"Ram it with the ride.","weights":{"skill:drive":2,"skill:force":1,"attr:nerves":1,"trope:free_spirit":1}},{"text":"Climb over before anyone notices.","weights":{"skill:stunt":2,"skill:dexterity":1,"attr:brawn":1,"trope:free_spirit":1}},{"text":"Talk the crew into opening a gap.","weights":{"skill:speech":2,"skill:leadership":1,"attr:smooth":1,"trope:cheater":1}},{"text":"Disappear into the side streets.","weights":{"skill:streetwise":2,"skill:survival":1,"attr:crime":1,"trope:cheater":1}}]},{"id":"q30","prompt":"At the showdown, the villain offers one last warning. You…","answers":[{"text":"Listen for the weakness in the speech.","weights":{"skill:detect":2,"skill:cool":1,"attr:focus":1,"trope:cool_but_distressed":1}},{"text":"Step forward and refuse to yield.","weights":{"skill:endure":2,"skill:fight":1,"attr:brawn":1,"trope:diehard":1}},{"text":"Turn the crowd against them.","weights":{"skill:leadership":2,"skill:speech":1,"attr:smooth":1,"trope:leader":1}},{"text":"Take the shot nobody else can make.","weights":{"skill:shoot":2,"skill:awareness":1,"attr:nerves":1,"trope:bad_to_the_bone":1}}]}]'),r_={_meta:e_,questions:t_},n_={source:"Assistant Director ENG 1.0",additionalSources:["Outgunned Corebook ENG"],transcribed:"2026-09-05"},i_=JSON.parse('{"villain_generator":{"die":"d6","pageRef":13,"source":"Assistant Director ENG 1.0","columns":["nature","desire","problem"],"rows":[{"roll":1,"nature":"Politician","desire":"Avarice / Decadence","proble nts Help to treat wounds.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},grappling_hook:{name:"Grappling Hook",kind:"tool",cost:1,features:["help_climb","help_swing"],description:"Grants Help to climb and swing.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},rope:{name:"Rope",kind:"tool",cost:1,features:[],description:"A long, very sturdy rope.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},compass:{name:"Compass",kind:"tool",cost:1,features:["help_bearings"],description:"Grants Help to find your bearings or magnetic North.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},winter_clothes:{name:"Winter Clothes",kind:"tool",cost:1,features:["help_cold_weather"],description:"Grant Help to withstand cold or bad weather.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},lantern:{name:"Lantern",kind:"tool",cost:1,features:["help_see_in_dark","hindrance_hiding"],description:"Grants Help to see in the dark but is a Hindrance when hiding.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},climbing_gear:{name:"Climbing Gear",kind:"tool",cost:2,features:["help_climb"],description:"Grants Help when climbing walls made of rock or ice.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},camping_cookware:{name:"Camping Cookware",kind:"tool",cost:1,features:["help_camp_cooking"],description:"Grants Help to cook in a Camp.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},musical_instrument:{name:"Musical Instrument",kind:"tool",cost:2,features:[],description:"Allows you to play and perform.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},old_ride:{name:"Old Ride",kind:"ride",cost:3,features:[],description:"An old plane, ship, or jeep.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},lighter:{name:"Lighter",kind:"tool",cost:1,features:["help_light_fire"],description:"Grants Help to light a fire.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},radio:{name:"Radio",kind:"tool",cost:3,features:["bulky"],description:"Allows communication at a distance; Bulky.",pageRef:132,source:"Outgunned Adventure ENG 1.1"},pistol:{name:"Pistol/Revolver",kind:"gun",cost:1,features:[],description:"Allows you to shoot.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},revolver:{name:"Pistol/Revolver",kind:"gun",cost:1,features:[],description:"Allows you to shoot.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},old_rifle:{name:"Old Rifle",kind:"gun",cost:1,features:["slow_reload"],description:"Slow Reload; allows you to shoot with +1.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},hunting_rifle:{name:"Hunting Rifle",kind:"gun",cost:2,features:["accurate","slow_reload"],description:"Accurate, Slow Reload; allows you to shoot with +1.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},shotgun:{name:"Shotgun",kind:"gun",cost:2,features:["impact","slow_reload"],description:"Impact, Slow Reload; allows you to shoot with +1.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},machine_gun:{name:"Machine Gun",kind:"gun",cost:3,features:["rapid_fire"],description:"Rapid Fire; allows you to shoot with +1.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},gatling_gun:{name:"Gatling Gun",kind:"gun",cost:null,features:["fixed","rapid_fire","uncommon"],description:"Fixed, Rapid Fire, Uncommon; allows you to shoot with +2.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},bow:{name:"Bow",kind:"gun",cost:2,features:["silent","single_shot"],description:"Silent, Single Shot; allows you to shoot arrows.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},hunting_bow:{name:"Hunting Bow",kind:"gun",cost:3,features:["accurate","silent","single_shot"],description:"Accurate, Silent, Single Shot; allows you to shoot arrows with +1.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},dynamite:{name:"Dynamite",kind:"gun",cost:2,features:["boom","single_shot"],description:"Boom!, Single Shot.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},machete_axe:{name:"Machete/Axe",kind:"melee",cost:1,features:["melee_weapon","sharp"],description:"Melee Weapon, Sharp.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},club_hammer:{name:"Club/Hammer",kind:"melee",cost:1,features:["impact","melee_weapon"],description:"Impact, Melee Weapon.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},boomerang:{name:"Boomerang",kind:"melee",cost:2,features:[],description:"Comes back when thrown.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},whip:{name:"Whip",kind:"melee",cost:1,features:["melee_weapon"],description:"Melee Weapon; can be used to grab distant items.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},rocket_launcher:{name:"Rocket Launcher",kind:"gun",cost:null,features:["boom","single_shot","slow_reload","uncommon"],description:"Boom!, Single Shot, Slow Reload, Uncommon; allows you to shoot with +1.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},projectiles:{name:"Projectiles",kind:"ammunition",cost:null,features:["uncommon"],description:"10 arrows for a bow or 1 rocket for a rocket launcher.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},mags:{name:"Mags (2)",kind:"ammunition",cost:1,features:[],description:"Two mags for a type of weapon of your choice.",pageRef:133,source:"Outgunned Adventure ENG 1.1"},diary:{name:"Diary",kind:"common",cost:null,features:[],description:"An everyday object; included with the Professor’s starting gear.",pageRef:34,source:"Outgunned Adventure ENG 1.1"}},f_={_meta:o_,genre:s_,roles:l_,tropes:u_,feats:c_,gear:d_},h_={id:"superheroes",name:"Outgunned Superheroes",source:"books/superheroes/english/Outgunned_Superheroes_ENG_1_0.pdf",quickstartSource:"books/superheroes/english/OGS_Quickstart_ENG.pdf",sources:["books/superheroes/english/Outgunned_Superheroes_ENG_1_0.pdf","books/superheroes/english/OGS_Quickstart_ENG.pdf"],transcribed:"2026-09-05",notes:"Standalone Superheroes genre-book options. Page references are the printed page numbers in the English 1.0 book. Summaries are concise paraphrases of the cited rules."},p_="superheroes",m_=JSON.parse(`{"acrobat":{"name":"Acrobat","pageRef":92,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to run, jump, balance, and perform acrobatics."},"barrier":{"name":"Barrier","pageRef":92,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","cost":1,"summary":"Create or summon barriers that stop water, flames, wind, or a small explosion; Indestructible Barrier gives Total Cover to you and four others while you stay still and focused."},"bulletproof":{"name":"Bulletproof","pageRef":92,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Immune to firearm damage, but not energy or explosive damage; a friend can use you as Partial Cover in a shootout."},"bullseye":{"name":"Bullseye","pageRef":92,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to hit a target precisely with a small object or ranged weapon."},"cyborg":{"name":"Cyborg","pageRef":92,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to Fix; use Fix instead of Heal to remove Hurt. Solid Metal lets you spend 1 Power to repeat a failed Reaction Roll."},"detective":{"name":"Detective","pageRef":93,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to find clues, follow trails, or search a room."},"energy_manipulation":{"name":"Energy Manipulation","pageRef":93,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain the Energy Blade and Energy Bolt super-weapons. Choose this Feat twice to give Energy Bolt Maximum Power.","superWeapons":["energy_blade","energy_bolt"],"repeatable":true,"maxRanks":2},"familiar":{"name":"Familiar","pageRef":93,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a small animal, magical creature, robot, or similar companion. It takes one small Quick Action each Turn, tries to Help you, shares your Grit, and cannot be Left for Dead."},"flight":{"name":"Flight","pageRef":93,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Fly and hover freely; Stunt usually handles fast or agile flight."},"foresight":{"name":"Foresight","pageRef":93,"source":"Outgunned Superheroes ENG 1.0","activation":"session","summary":"Once per Session, predict an action's outcome for yourself and a friend, then accept it or rewind and choose differently or warn allies. Read Your Opponent lets you spend Power equal to an Enemy Special Action's level to stop it before it happens.","specialActions":[{"name":"Read Your Opponent","cost":"action level","summary":"Stop an Enemy Special Action before it resolves."}]},"gadget":{"name":"Gadget","pageRef":94,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Choose one Gadget from the genre-book Gadget list; it cannot be bought with Cash. This Feat may be chosen more than once.","repeatable":true},"giant_growth":{"name":"Giant Growth","pageRef":94,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","cost":1,"summary":"Become a giant. Giant Form sets Brawn to 5 and halves incoming Grit loss rounded up, but automatically fails Crime, acts only every other Turn, and is extremely slow. Return to normal at 0 Grit, Broken, Powerless, Scene end, or by choice; then become Tired (or Broken if already Tired)."},"hacker":{"name":"Hacker","pageRef":94,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll for computer, hacking, and bypassing IT security rolls."},"hard_to_kill":{"name":"Hard to Kill","pageRef":95,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"When you fill your Bad Box, gain 1 Power and +1 to your next roll."},"heartbreaker":{"name":"Heartbreaker","pageRef":95,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll when seducing or making a good impression."},"immortality":{"name":"Immortality","pageRef":95,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"When Left for Dead, appear dead and flip a coin once per Turn; on Tails, return with 1 Grit and remove one Condition. Reassembling after dismemberment or burial takes two days."},"incorporeal":{"name":"Incorporeal","pageRef":96,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"Move through a wall, floor, or other solid surface as air. Phase Shift lets you spend 1 Power to become incorporeal instantly or automatically dodge one melee attack.","specialActions":[{"name":"Phase Shift","cost":1,"summary":"Become incorporeal instantly or automatically dodge one melee attack."}]},"invisible":{"name":"Invisible","pageRef":96,"source":"Outgunned Superheroes ENG 1.0","activation":"quick_action","summary":"Turn invisible or visible as a Quick Action; while invisible, gain Help to avoid detection and can make an Enemy lose track of you and skip its next Reaction Turn if you do not attack. Visibility ends after losing 2+ Grit in one hit, suffering a Condition, or choosing to end it."},"jump":{"name":"Jump","pageRef":96,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Make very long/high jumps and never lose Grit from falling. Leap Attack costs 1 Power to attack a distant or flying Enemy as if in melee with +1 and a Free Re-roll.","specialActions":[{"name":"Leap Attack","cost":1,"summary":"Attack a distant or flying Enemy as melee with +1 and a Free Re-roll."}]},"lord_of_the_seas":{"name":"Lord of the Seas","pageRef":96,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"In water, gain a Free Re-roll to all rolls, Help to swim, underwater breathing, and communication with fish and other sea creatures. Call of the Sea costs 1 Power to bring sea creatures to Help.","specialActions":[{"name":"Call of the Sea","activation":"quick_action","cost":1,"summary":"Call one or more nearby sea creatures to Help."}]},"mind_control":{"name":"Mind Control","pageRef":97,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to persuade someone to cooperate or help. Puppet costs 1 Power to control a supporting character for a Full Turn; control ends on lost Grit, a Condition, or lost focus. Controlling an Enemy requires an Action Roll against its Defense.","specialActions":[{"name":"Puppet","activation":"full_turn","cost":1,"summary":"Control a supporting character's movement, but not actions that harm them; an Enemy requires a roll against Defense."}]},"monster":{"name":"Monster","pageRef":97,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Your non-human appearance gives a Hindrance when interacting with unfamiliar people but a Help to intimidate."},"multiple_hero":{"name":"Multiple Hero","pageRef":97,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"Create copies. Roll Smooth+Endure: one copy per Basic Success, three per Critical, nine per Extreme. Copies take only a small Quick Action, each counts as one Grit, and can be sacrificed to prevent equal Grit loss. They dissolve when hit, too far away, dismissed, Powerless, or at Scene end; then you become Tired or Broken.","specialActions":[{"name":"Multiplication","activation":"full_turn","summary":"Roll Smooth+Endure to create copies using the success conversion above."}]},"new_powers":{"name":"New Powers","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a new Superpower except Invincible or One of a Kind, when it makes sense in the story and all Players agree."},"only_weakness":{"name":"Only Weakness","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Choose a weakness (or let the Director choose). Exposure causes Powerless. At character creation, this Feat grants another Feat; it does not grant one when gained from Invincible."},"personal_ai":{"name":"Personal A.I.","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"An A.I. in your suit or accessory, or a hyperdeveloped A.I., answers general knowledge questions, tracks nearby Enemies, and gives Help to analyze a city's or building's layout for an escape route."},"phd":{"name":"PhD","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Choose a field of study and gain a Free Re-roll for rolls concerning that specialty."},"pint_sized":{"name":"Pint-sized","pageRef":98,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"At roughly half human height, gain a Free Re-roll to Stealth or dodging projectiles, and Help to squeeze through narrow spaces or go unnoticed."},"power_absorption":{"name":"Power Absorption","pageRef":99,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"Touch a powered ally to steal their Superpower and connected Feats until Scene end while they become Powerless; an Enemy must be disabled for one Turn and the Director determines stolen extent.","specialActions":[{"name":"Stolen Power","activation":"full_turn","summary":"Touch an ally or disabled Enemy to temporarily copy their powers; an ally becomes Powerless."}]},"power_mirror":{"name":"Power-Mirror","pageRef":100,"source":"Outgunned Superheroes ENG 1.0","activation":"quick_action","cost":1,"summary":"Touch a powered person to immediately use one of their special actions or temporarily gain their Superpower's benefits. During a Time-Out, an action can help a friend Show Off their Superpower.","specialActions":[{"name":"Borrowed Power","activation":"quick_action","cost":1,"summary":"Copy one special action or temporarily gain a touched person's Superpower benefits."}]},"prep_time":{"name":"Prep Time","pageRef":100,"source":"Outgunned Superheroes ENG 1.0","activation":"session","summary":"Once per Session, ask the Director for information about a person or place. Once per combat after an Enemy reveals a Feat, spend 1 Power to counter it until Scene end.","specialActions":[{"name":"Prepared","cost":1,"summary":"After an Enemy reveals a Feat, make it unavailable until Scene end."}]},"proven_driver":{"name":"Proven Driver","pageRef":100,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Choose a ride type and gain a Free Re-roll to drive, repair, or evaluate that type."},"regeneration":{"name":"Regeneration","pageRef":101,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Whenever an Enemy or physical danger would make you lose 3+ Grit, lose 1 less. Fast Recovery costs 1 Power to recover 3 Grit or remove Tired/Hurt.","specialActions":[{"name":"Fast Recovery","activation":"quick_action","cost":1,"summary":"Recover 3 Grit or remove Tired or Hurt."}]},"shrinkage":{"name":"Shrinkage","pageRef":101,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"Shrink to tiny size without losing strength; while shrunk gain Help to squeeze through spaces or go unnoticed. Instant Miniaturization costs 1 Power to shrink immediately, escape a grapple/restraints, or automatically succeed at a relevant Reaction Roll. Instant Enlargement costs 1 Power to return to normal and attack with +1 and a Free Re-roll.","specialActions":[{"name":"Instant Miniaturization","cost":1,"summary":"Shrink immediately, escape restraints, or automatically succeed at a relevant Reaction Roll."},{"name":"Instant Enlargement","cost":1,"summary":"Return to normal size and attack with +1 and a Free Re-roll."}]},"silver_tongue":{"name":"Silver Tongue","pageRef":101,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to lie, persuade, compromise, or bargain."},"sonic_boom":{"name":"Sonic Boom","pageRef":101,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Use your voice or sonic waves to destroy objects and barriers; gain Sonic Wave. Choose twice to add Maximum Power.","superWeapons":["sonic_wave"],"repeatable":true,"maxRanks":2},"speak_with_animals":{"name":"Speak with Animals","pageRef":102,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Understand and speak with animals. Call of the Wild costs 1 Power as a Quick Action to call nearby animals to Help.","specialActions":[{"name":"Call of the Wild","activation":"quick_action","cost":1,"summary":"Call nearby animals to Help."}]},"super_senses":{"name":"Super Senses","pageRef":102,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to combat Reaction Rolls and rolls to sense danger, prevent ambush, or spot lurking Enemies. Attention costs 1 Power to repeat a failed Detect or Awareness Roll.","specialActions":[{"name":"Attention","cost":1,"summary":"Repeat a failed Detect or Awareness Roll."}]},"super_ride":{"name":"Super-Ride","pageRef":102,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a hyper-technological, magical, or alien ride and a Free Re-roll to drive it. Ride Recall costs 1 Power as a Quick Action to summon it.","specialActions":[{"name":"Ride Recall","activation":"quick_action","cost":1,"summary":"Recall or summon your super-ride."}]},"team_leader":{"name":"Team Leader","pageRef":102,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Gain a Free Re-roll to inspire/coordinate and remove Like a Fool or Defeated. When Heroes assemble, a speech raises starting Teamwork to 2."},"trained_fighter":{"name":"Trained Fighter","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Choose a fighting style or melee weapon and gain a Free Re-roll for all Action and Reaction Rolls using it."},"transformation":{"name":"Transformation","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"full_turn","summary":"You have a human form without your Superpower or connected Feats and a powered form with all sheet powers/Feats. On transforming, move one Attribute Point. Quick Shift costs 1 Power to transform as a Quick Action and recover all Grit.","specialActions":[{"name":"Quick Shift","activation":"quick_action","cost":1,"summary":"Transform quickly and recover all Grit."}]},"unlimited_funds":{"name":"Unlimited Funds","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"At creation, spend up to 10 Cash on gear instead of 4 and start with 5 Cash. Once per Session, leverage your wealth for an exclusive service such as a private jet, gala access, hotel, or restaurant."},"unstoppable_force":{"name":"Unstoppable Force","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"quick_action","cost":1,"summary":"Gain +1 to your next combat Action Roll; on a hit, the Enemy loses 1 extra Grit. Combine with other special actions such as Smash or Explosive Force.","specialActions":[{"name":"Devastating Attack","activation":"quick_action","cost":1,"summary":"Gain +1 to the next combat Action Roll and deal +1 Grit on a hit."}]},"wall_climber":{"name":"Wall-Climber","pageRef":103,"source":"Outgunned Superheroes ENG 1.0","activation":"passive","summary":"Move on walls and ceilings and gain a Free Re-roll to climb."}}`),g_={arcane_powers:{name:"Arcane Powers",pageRef:74,source:"Outgunned Superheroes ENG 1.0",summary:"Magic can summon small everyday objects, make illusions, move unsecured objects telekinetically, and create astral projections. Complex or tiring uses roll Smooth+Leadership with a Director-set difficulty and a Free Re-roll.",startingPower:2,specialActions:[{name:"Astral Projection",activation:"full_turn",cost:1,summary:"Create a light projection that can float, turn invisible, pass through solids, and see, hear, and speak; the body stays still and the projection ends if focus is lost, you are struck, or wounded."}],choice:"Choose Magical Weapon or Arcane Missile; the pure-light weapon can be summoned or dismissed."},battleborn:{name:"Battleborn",pageRef:75,source:"Outgunned Superheroes ENG 1.0",summary:"Choose bows, guns, or melee weapons. Gain a Free Re-roll to use, repair, evaluate, or handle that type, plus the matching weapon benefit.",choices:{guns:"Gain 2 Guns and 6 Mags for free; reload once per Turn without an action; firing two guns at once gives +1.",bows:"Gain a Bow and 24 arrows for free; +1 to shoot arrows, and after spending a Turn aiming gain another +1 to the next arrow shot.",melee_weapons:"Gain one weapon or a pair of the chosen type for free with Perfect; +1 to fight with it, and a same-type pair gives +1 to dodge projectiles."}},dark_presence:{name:"Dark Presence",pageRef:75,source:"Outgunned Superheroes ENG 1.0",summary:"Gain a Free Re-roll to all Crime rolls and +1 to ambush or strike unaware Enemies.",specialActions:[{name:"Vanish",activation:"quick_action",cost:1,summary:"Hide, escape a difficult situation, break a grapple, or reach Partial/Total Cover; spend another Power that Turn to reappear nearby in sight."}]},elemental_control:{name:"Elemental Control",pageRef:76,source:"Outgunned Superheroes ENG 1.0",summary:"Choose Water, Electricity, Fire, Ice, Storm, Earth, or Wind. Complex or tiring uses roll against a Director-set difficulty; simple uses need no roll and extraordinary uses may cost Power. While not Powerless, you are immune to your element's damage and gain Elemental Ray.",elements:{water:"Pushes things, puts out fires, and breaks barriers.",electricity:"Destroys obstacles and overloads technology.",fire:"Burns wood and fabric, scares people, and keeps enemies away.",ice:"Freezes, makes surfaces slippery, and creates barriers.",storm:"Controls weather and generates lightning.",earth:"Builds platforms and barriers.",wind:"Pushes objects and people and blows out flames."},specialActions:[{name:"Elemental Form",activation:"quick_action",cost:1,summary:"Until combat or the Scene ends, fly as with Flight and gain a Free Re-roll when using the element or Elemental Ray."}],superWeapons:["elemental_ray"]},enhanced_body:{name:"Enhanced Body",pageRef:76,source:"Outgunned Superheroes ENG 1.0",summary:"Gain a Free Re-roll to all Brawn rolls and automatically gain Trained Fighter.",specialActions:[{name:"I Can Do This All Day",activation:"free",summary:"Once per Scene, when losing more than 3 Grit at once, gain 1 Power."}]},force_control:{name:"Force Control",pageRef:77,source:"Outgunned Superheroes ENG 1.0",summary:"Choose Cosmic Force or Electromagnetic Force. Cosmic Force makes flying platforms, moves small unsecured items, opens unreachable doors, and creates Partial-Cover shields as a Quick Action. Electromagnetic Force controls ferromagnetic metals; complex or tiring uses roll Focus+Cool with a Free Re-roll. Simple uses need no roll; very heavy, anchored, or large uses may cost Power.",choices:{cosmic_force:"Create human-bearing flying platforms, move small items telekinetically, open untouchable doors, and make small Partial-Cover shields as a Quick Action.",electromagnetic_force:"Telekinetically control iron, steel, and other ferromagnetic metals; complex or tiring uses are Focus+Cool with a Free Re-roll."}},hyper_technological_armor:{name:"Hyper-technological Armor",pageRef:78,source:"Outgunned Superheroes ENG 1.0",summary:"Putting on the armor takes a Full Turn. While wearing it, Brawn is always 3, Hurt penalties are ignored, and you can fly, breathe underwater and in space, and use the Energy Beam super-weapon. Gain a Free Re-roll to shoot Energy Beam and ranged weapons added to the armor.",superWeapons:["energy_beam"],specialActions:[{name:"Recall",activation:"quick_action",cost:1,summary:"When near or in the open, call the armor to fly onto your body."}]},incredible_strength:{name:"Incredible Strength",pageRef:78,source:"Outgunned Superheroes ENG 1.0",summary:"Gain +1 to Force and Endure rolls, ignore Brawn -1 penalties and Conditions while not Powerless, and always gain Help to crash, lift, throw, or break things. You suffer a Hindrance to go unnoticed or fit in narrow spaces. An always
